<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>展開シミュレーター - Keiba Pace & Formation</title>

  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="展開シム">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#090d16">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* iOS セーフエリアおよびネイティブアプリライクなUI設定 */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body {
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: pan-y;
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .dropzone-highlight {
      background-color: rgba(59, 130, 246, 0.15) !important;
      border-color: #3b82f6 !important;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- アプリヘッダー -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-lg border border-emerald-500/40">
        🏇
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm font-bold tracking-tight text-white">東京11R 天皇賞(秋) GⅠ</h1>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 font-medium">芝2000m・良</span>
        </div>
        <p class="text-[11px] text-slate-400">想定隊列＆ペースシミュレーター</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="resetBtn" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors text-xs flex items-center gap-1">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        <span>初期化</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 p-3 md:p-6 max-w-6xl mx-auto w-full flex flex-col gap-4">

    <!-- ペース判定パネル -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">想定ペース判定</span>
            <span id="paceBadge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
              ミドルペース
            </span>
          </div>
          <p id="paceComment" class="text-xs text-slate-300 mt-1">
            単騎ハナの可能性が高く、前半1000mは60秒前後の落ち着いた流れ。
          </p>
        </div>
        
        <!-- シナリオワンタップ切替 -->
        <div class="flex items-center gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
          <button onclick="applyPreset('slow')" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all text-xs" id="btn-slow">単騎スロー</button>
          <button onclick="applyPreset('middle')" class="px-2.5 py-1 rounded-lg bg-slate-800 text-white font-medium shadow-sm transition-all text-xs" id="btn-middle">標準想定</button>
          <button onclick="applyPreset('high')" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all text-xs" id="btn-high">激流ハイ</button>
        </div>
      </div>

      <!-- ペースメーターバー -->
      <div class="w-full bg-slate-950 rounded-full h-3 p-0.5 border border-slate-800 relative overflow-hidden">
        <div class="flex h-full w-full rounded-full overflow-hidden">
          <div class="w-1/3 bg-blue-500/30"></div>
          <div class="w-1/3 bg-emerald-500/30"></div>
          <div class="w-1/3 bg-rose-500/30"></div>
        </div>
        <div id="paceIndicator" class="absolute top-0 bottom-0 w-2.5 bg-white rounded-full shadow-[0_0_8px_rgba(255,255,255,0.8)] transition-all duration-500 ease-out" style="left: 48%;"></div>
      </div>
      <div class="flex justify-between text-[10px] text-slate-500 mt-1 font-mono">
        <span>SLOW（瞬発力・前有利）</span>
        <span>MIDDLE（地力重視）</span>
        <span>HIGH（持続力・差し有利）</span>
      </div>
    </section>

    <!-- 隊列マップ (2D Canvas風) -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <i data-lucide="layout-grid" class="w-4 h-4 text-emerald-400"></i>
          <h2 class="text-xs font-bold text-slate-200">想定隊列マップ（← 進行方向 / ゴール）</h2>
        </div>
        <span class="text-[10px] text-slate-400">枠をタップまたはドラッグで位置調整</span>
      </div>

      <!-- コースキャンバスコンテナ -->
      <div class="overflow-x-auto custom-scrollbar pb-2 pt-1">
        <div class="min-w-[680px] bg-slate-950 border border-slate-800 rounded-xl p-3 relative">
          <!-- 内ラチライン -->
          <div class="absolute top-0 left-0 right-0 h-1 bg-emerald-500/40 rounded-t-xl"></div>
          
          <div class="grid grid-cols-5 gap-2 text-center text-[10px] text-slate-400 font-medium mb-2 border-b border-slate-800 pb-1">
            <div class="flex items-center justify-center gap-1 text-emerald-400 font-bold">
              <span>先頭（ハナ）</span>
              <i data-lucide="arrow-left" class="w-3 h-3"></i>
            </div>
            <div>2番手</div>
            <div>好位（3〜5番手）</div>
            <div>中団</div>
            <div>後方・追込</div>
          </div>

          <!-- 各レーン (内・中・外) -->
          <div class="flex flex-col gap-2.5">
            <!-- 内目 (レーン1) -->
            <div class="flex items-center gap-2">
              <span class="text-[9px] w-9 text-slate-500 font-mono shrink-0">内ラチ</span>
              <div class="grid grid-cols-5 gap-2 flex-1">
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="0" data-row="0"></div>
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="1" data-row="0"></div>
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="2" data-row="0"></div>
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="3" data-row="0"></div>
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="4" data-row="0"></div>
              </div>
            </div>

            <!-- 中目 (レーン2) -->
            <div class="flex items-center gap-2">
              <span class="text-[9px] w-9 text-slate-500 font-mono shrink-0">2列目</span>
              <div class="grid grid-cols-5 gap-2 flex-1">
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="0" data-row="1"></div>
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="1" data-row="1"></div>
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="2" data-row="1"></div>
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="3" data-row="1"></div>
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="4" data-row="1"></div>
              </div>
            </div>

            <!-- 外目 (レーン3) -->
            <div class="flex items-center gap-2">
              <span class="text-[9px] w-9 text-slate-500 font-mono shrink-0">外回し</span>
              <div class="grid grid-cols-5 gap-2 flex-1">
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="0" data-row="2"></div>
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="1" data-row="2"></div>
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="2" data-row="2"></div>
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="3" data-row="2"></div>
                <div class="zone min-h-[58px] rounded-lg border border-dashed border-slate-800 bg-slate-900/40 p-1 flex flex-wrap gap-1 items-center justify-center" data-col="4" data-row="2"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 出走馬リスト＆展開利スコア一覧 -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="list-ordered" class="w-4 h-4 text-emerald-400"></i>
          <h2 class="text-xs font-bold text-slate-200">出走馬・展開利評価ランキング</h2>
        </div>
        <span class="text-[10px] text-slate-500">※隊列に応じてスコアが自動変動</span>
      </div>

      <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b border-slate-800 text-slate-400 text-[10px]">
              <th class="py-2 px-2">馬番・馬名</th>
              <th class="py-2 px-2 text-center">脚質</th>
              <th class="py-2 px-2 text-center">テン3F</th>
              <th class="py-2 px-2 text-center">隊列位置</th>
              <th class="py-2 px-2 text-right">展開利スコア</th>
            </tr>
          </thead>
          <tbody id="runnersTableBody" class="divide-y divide-slate-800/60 font-mono">
            <!-- JSで動的レンダリング -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 馬詳細ドロワーモーダル -->
  <div id="horseModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div class="bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 p-1.5 rounded-full bg-slate-800 text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    // JRA枠番カラー定義 (1〜8枠)
    const WAKU_COLORS = {
      1: { bg: '#ffffff', text: '#000000', border: '#cbd5e1' }, // 白
      2: { bg: '#1e293b', text: '#ffffff', border: '#475569' }, // 黒
      3: { bg: '#ef4444', text: '#ffffff', border: '#dc2626' }, // 赤
      4: { bg: '#3b82f6', text: '#ffffff', border: '#2563eb' }, // 青
      5: { bg: '#eab308', text: '#000000', border: '#ca8a04' }, // 黄
      6: { bg: '#22c55e', text: '#ffffff', border: '#16a34a' }, // 緑
      7: { bg: '#f97316', text: '#ffffff', border: '#ea580c' }, // 橙
      8: { bg: '#ec4899', text: '#ffffff', border: '#db2777' }, // 桃
    };

    // レース出走馬データ (サンプル)
    const initialRunners = [
      { num: 1,  waku: 1, name: "べラジオオペラ", style: "先行", styleCode: "front", tenIndex: 35.2, col: 1, row: 0, note: "内枠引いて好位イン追走濃厚。ロスなく立ち回れば展開利大。" },
      { num: 3,  waku: 2, name: "ドウデュース", style: "追込", styleCode: "closer", tenIndex: 36.8, col: 4, row: 1, note: "後方待機から直線一気の上がり最速狙い。ハイペース展開で浮上。" },
      { num: 6,  waku: 3, name: "ソールオリエンス", style: "差し", styleCode: "stalker", tenIndex: 36.4, col: 3, row: 2, note: "外から長く良い脚を使うタイプ。馬場が渋るか激流になれば。" },
      { num: 7,  waku: 4, name: "ドウフォルツァ", style: "逃げ", styleCode: "lead", tenIndex: 34.6, col: 0, row: 0, note: "ハナ主張候補筆頭。単騎で運べればスローペースに落とし込める。" },
      { num: 10, waku: 5, name: "マテンロウスカイ", style: "逃げ", styleCode: "lead", tenIndex: 34.8, col: 0, row: 1, note: "前走果敢に先行。7番とハナ争いになるとペースが一気に跳ね上がる。" },
      { num: 11, waku: 6, name: "ジャスティンパレス", style: "追込", styleCode: "closer", tenIndex: 36.9, col: 4, row: 0, note: "スタミナ自慢の末脚型。後半ロングスパートで前を呑み込む形。" },
      { num: 12, waku: 6, name: "リバティアイランド", style: "先行/好位", styleCode: "front", tenIndex: 35.5, col: 2, row: 1, note: "自在性抜群。好位外目からいつでも抜け出せる万能ポジション。" },
      { num: 14, waku: 7, name: "レーベンスティール", style: "差し", styleCode: "stalker", tenIndex: 35.8, col: 3, row: 1, note: "中団で脚を溜めて直線瞬発力勝負。揉まれない外目が好走条件。" }
    ];

    let runners = JSON.parse(JSON.stringify(initialRunners));
    let draggedRunnerNum = null;

    // 隊列描画
    function renderFormation() {
      // 全ゾーンクリア
      document.querySelectorAll('.zone').forEach(z => z.innerHTML = '');

      runners.forEach(r => {
        const zone = document.querySelector(`.zone[data-col="${r.col}"][data-row="${r.row}"]`);
        if (!zone) return;

        const wakuStyle = WAKU_COLORS[r.waku];
        const chip = document.createElement('div');
        chip.draggable = true;
        chip.className = `flex items-center gap-1.5 px-2 py-1 rounded-lg text-xs font-bold cursor-grab active:cursor-grabbing transition-transform active:scale-95 shadow-md border`;
        chip.style.backgroundColor = wakuStyle.bg;
        chip.style.color = wakuStyle.text;
        chip.style.borderColor = wakuStyle.border;
        chip.dataset.num = r.num;

        chip.innerHTML = `
          <span class="w-4 h-4 rounded-full flex items-center justify-center text-[10px] bg-black/20 text-current">${r.num}</span>
          <span class="truncate max-w-[70px] text-[11px]">${r.name}</span>
        `;

        // ドラッグイベント (デスクトップ)
        chip.addEventListener('dragstart', (e) => {
          draggedRunnerNum = r.num;
          e.dataTransfer.setData('text/plain', r.num);
        });

        // クリックで詳細ドロワー
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          openModal(r);
        });

        zone.appendChild(chip);
      });

      evaluatePaceAndScores();
      renderTable();
    }

    // ドロップゾーンのイベントリスナー設定
    document.querySelectorAll('.zone').forEach(zone => {
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('dropzone-highlight');
      });
      zone.addEventListener('dragleave', () => {
        zone.classList.remove('dropzone-highlight');
      });
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('dropzone-highlight');
        const num = parseInt(draggedRunnerNum || e.dataTransfer.getData('text/plain'));
        const targetCol = parseInt(zone.dataset.col);
        const targetRow = parseInt(zone.dataset.row);

        const runner = runners.find(r => r.num === num);
        if (runner) {
          runner.col = targetCol;
          runner.row = targetRow;
          renderFormation();
        }
      });
    });

    // ペース判定と展開利スコア計算
    function evaluatePaceAndScores() {
      const leadRunners = runners.filter(r => r.col === 0);
      const leadCount = leadRunners.length;

      let paceState = 'middle';
      let paceScore = 50; // 0: 極スロー, 50: ミドル, 100: ハイ

      if (leadCount === 0) {
        paceState = 'slow';
        paceScore = 20;
      } else if (leadCount === 1) {
        paceState = 'slow';
        paceScore = 32;
      } else if (leadCount === 2) {
        paceState = 'middle';
        paceScore = 55;
      } else {
        paceState = 'high';
        paceScore = 85;
      }

      // UI 更新
      const indicator = document.getElementById('paceIndicator');
      const badge = document.getElementById('paceBadge');
      const comment = document.getElementById('paceComment');

      indicator.style.left = `calc(${paceScore}% - 5px)`;

      if (paceState === 'slow') {
        badge.textContent = 'スローペース想定';
        badge.className = 'text-xs font-bold px-2.5 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30';
        comment.textContent = 'ハナ争いなく単騎。直線瞬発力勝負・好位インの先行勢が圧倒的有利。';
      } else if (paceState === 'middle') {
        badge.textContent = 'ミドルペース想定';
        badge.className = 'text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
        comment.textContent = '平均的なラップ推移。隊列の位置取り・能力通りの決着になりやすい。';
      } else {
        badge.textContent = 'ハイペース（激流）想定';
        badge.className = 'text-xs font-bold px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30';
        comment.textContent = '先頭が複数頭で激しい競り合い。前崩れの可能性大、中団〜後方の差し馬に展開利。';
      }

      // 各馬の展開利スコアを計算
      runners.forEach(r => {
        let score = 70; // 基準点

        // ポジションボーナス
        if (paceState === 'slow') {
          if (r.col === 0) score += 18; // ハナ
          else if (r.col === 1 || r.col === 2) score += 12; // 番手・好位
          else if (r.col === 4) score -= 14; // 後方は届かず
        } else if (paceState === 'high') {
          if (r.col === 0) score -= 18; // 激流ハナは失速
          else if (r.col === 3) score += 16; // 中団差しがベスト
          else if (r.col === 4) score += 12; // 追込も浮上
        } else {
          if (r.col === 1 || r.col === 2) score += 10; // 好位が無難
        }

        // レーン補正 (内ラチ沿い vs 外回し)
        if (r.row === 0) score += 4;  // 内ロスなし
        if (r.row === 2) score -= 4;  // 外回し距離ロス

        r.currentScore = Math.max(30, Math.min(99, score));
      });
    }

    // テーブル描画
    function renderTable() {
      const tbody = document.getElementById('runnersTableBody');
      const sorted = [...runners].sort((a, b) => b.currentScore - a.currentScore);

      tbody.innerHTML = sorted.map(r => {
        const colNames = ['ハナ', '2番手', '好位', '中団', '後方'];
        const rowNames = ['内', '中', '外'];
        const wakuStyle = WAKU_COLORS[r.waku];

        let scoreColor = 'text-slate-300';
        if (r.currentScore >= 85) scoreColor = 'text-emerald-400 font-bold';
        else if (r.currentScore >= 75) scoreColor = 'text-amber-400 font-bold';
        else if (r.currentScore < 60) scoreColor = 'text-rose-400';

        return `
          <tr class="hover:bg-slate-800/40 transition-colors cursor-pointer" onclick="openModalByNum(${r.num})">
            <td class="py-2.5 px-2">
              <div class="flex items-center gap-1.5">
                <span class="w-5 h-5 rounded flex items-center justify-center text-[10px] font-bold border" 
                  style="background:${wakuStyle.bg}; color:${wakuStyle.text}; border-color:${wakuStyle.border}">
                  ${r.num}
                </span>
                <span class="font-sans font-medium text-slate-100">${r.name}</span>
              </div>
            </td>
            <td class="py-2.5 px-2 text-center text-slate-400 font-sans">${r.style}</td>
            <td class="py-2.5 px-2 text-center text-slate-400 font-mono">${r.tenIndex}</td>
            <td class="py-2.5 px-2 text-center text-slate-300 font-sans text-[11px]">
              ${colNames[r.col]}（${rowNames[r.row]}）
            </td>
            <td class="py-2.5 px-2 text-right ${scoreColor} font-mono text-sm">
              ${r.currentScore} <span class="text-[10px] text-slate-500 font-sans">pt</span>
            </td>
          </tr>
        `;
      }).join('');
    }

    // プリセット適用
    function applyPreset(type) {
      if (type === 'slow') {
        // 単騎スロー
        runners.forEach(r => {
          if (r.num === 7) { r.col = 0; r.row = 0; }
          else if (r.num === 10) { r.col = 1; r.row = 1; }
        });
      } else if (type === 'high') {
        // 複数頭競り合い
        runners.forEach(r => {
          if (r.num === 7) { r.col = 0; r.row = 0; }
          else if (r.num === 10) { r.col = 0; r.row = 1; }
        });
      } else {
        // 初期想定
        runners = JSON.parse(JSON.stringify(initialRunners));
      }

      ['slow', 'middle', 'high'].forEach(k => {
        const btn = document.getElementById(`btn-${k}`);
        if (k === type) {
          btn.className = 'px-2.5 py-1 rounded-lg bg-slate-800 text-white font-medium shadow-sm transition-all text-xs';
        } else {
          btn.className = 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all text-xs';
        }
      });

      renderFormation();
    }

    // モーダル表示
    function openModalByNum(num) {
      const r = runners.find(item => item.num === num);
      if (r) openModal(r);
    }

    function openModal(r) {
      const modal = document.getElementById('horseModal');
      const content = document.getElementById('modalContent');
      const wakuStyle = WAKU_COLORS[r.waku];

      content.innerHTML = `
        <div class="flex items-center gap-2 mb-3">
          <span class="w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm border" 
            style="background:${wakuStyle.bg}; color:${wakuStyle.text}; border-color:${wakuStyle.border}">
            ${r.num}
          </span>
          <div>
            <h3 class="text-base font-bold text-white">${r.name}</h3>
            <p class="text-xs text-slate-400">${r.waku}枠 ${r.num}番・脚質: ${r.style}</p>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2 my-3 text-xs">
          <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
            <span class="text-slate-500 block text-[10px]">テン3F指数</span>
            <span class="font-mono text-emerald-400 font-bold text-sm">${r.tenIndex}秒</span>
          </div>
          <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
            <span class="text-slate-500 block text-[10px]">現在の展開利スコア</span>
            <span class="font-mono text-amber-400 font-bold text-sm">${r.currentScore} pt</span>
          </div>
        </div>

        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-300 leading-relaxed mb-4">
          <span class="text-slate-400 font-semibold block mb-1">展開見解:</span>
          ${r.note}
        </div>

        <div class="flex gap-2">
          <button onclick="closeModal()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-white transition-colors">
            閉じる
          </button>
        </div>
      `;

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('horseModal').classList.add('hidden');
    }

    document.getElementById('horseModal').addEventListener('click', (e) => {
      if (e.target.id === 'horseModal') closeModal();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      runners = JSON.parse(JSON.stringify(initialRunners));
      applyPreset('middle');
    });

    // サービスワーカー登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered', reg))
          .catch(err => console.log('SW Error', err));
      });
    }

    // 初回初期化
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderFormation();
    });
  </script>
</body>
</html>
